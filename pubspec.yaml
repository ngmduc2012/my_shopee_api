name: my_shopee_api
description: A Dart client for the Shopee Affiliate Open API, with signed requests, product offers, affiliate links and structured errors.
version: 0.1.0-beta.1
homepage: https://github.com/ngmduc2012/my_shopee_api
repository: https://github.com/ngmduc2012/my_shopee_api
issue_tracker: https://github.com/ngmduc2012/my_shopee_api/issues
topics:
  - shopee
  - affiliate
  - api
  - graphql

environment:
  sdk: '>=3.9.0 <4.0.0'

dependencies:
  crypto: ^3.0.7
  http: ^1.6.0
  json_annotation: ^4.9.0

dev_dependencies:
  build_runner: ^2.4.14
  json_serializable: '>=6.9.2 <6.10.0'
  lints: ^5.1.1
  test: ^1.25.8
